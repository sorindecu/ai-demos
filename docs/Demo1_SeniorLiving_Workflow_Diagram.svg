<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="1100" fill="#F8F9FB" rx="12"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1A2E">Senior Living Intake — Automated Workflow</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#6B7280">Vectis Consulting LLC • Demo Flow</text>

  <!-- ══════════════ STEP 1: Website Contact Form ══════════════ -->
  <!-- Box -->
  <rect x="300" y="100" width="300" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="450" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="white">1. Prospect Submits</text>
  <text x="450" y="147" text-anchor="middle" font-size="12" fill="#BFDBFE">Website Contact Form</text>

  <!-- Arrow down -->
  <line x1="450" y1="164" x2="450" y2="198" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,200 444,188 456,188" fill="#94A3B8"/>

  <!-- ══════════════ STEP 2: Inbound Email Received ══════════════ -->
  <rect x="300" y="200" width="300" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="450" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="white">2. Inbound Email Received</text>
  <text x="450" y="247" text-anchor="middle" font-size="12" fill="#BFDBFE">Triggers automation pipeline</text>

  <!-- Arrow down -->
  <line x1="450" y1="264" x2="450" y2="298" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,300 444,288 456,288" fill="#94A3B8"/>

  <!-- ══════════════ STEP 3: Duplicate Check ══════════════ -->
  <!-- Diamond -->
  <polygon points="450,300 540,348 450,396 360,348" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Duplicate</text>
  <text x="450" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Check?</text>

  <!-- Duplicate found → right branch (dead end) -->
  <line x1="540" y1="348" x2="680" y2="348" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="682,348 670,342 670,354" fill="#94A3B8"/>
  <rect x="682" y="320" width="160" height="56" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="762" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">Duplicate Found</text>
  <text x="762" y="362" text-anchor="middle" font-size="11" fill="#B91C1C">Flag &amp; skip entry</text>
  <text x="610" y="338" text-anchor="middle" font-size="11" fill="#D97706">Yes</text>

  <!-- New → arrow down -->
  <line x1="450" y1="396" x2="450" y2="430" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,432 444,420 456,420" fill="#94A3B8"/>
  <text x="462" y="418" font-size="11" fill="#D97706">New</text>

  <!-- ══════════════ STEP 4: Add to Excel CRM ══════════════ -->
  <rect x="300" y="432" width="300" height="64" rx="10" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="450" y="459" text-anchor="middle" font-size="13" font-weight="bold" fill="white">3. Add to Excel CRM</text>
  <text x="450" y="479" text-anchor="middle" font-size="12" fill="#A7F3D0">New row: name, contact, date, status</text>

  <!-- Arrow down -->
  <line x1="450" y1="496" x2="450" y2="530" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,532 444,520 456,520" fill="#94A3B8"/>

  <!-- ══════════════ STEP 5: Eligibility Check ══════════════ -->
  <!-- Diamond -->
  <polygon points="450,532 540,580 450,628 360,580" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Eligibility</text>
  <text x="450" y="592" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Check?</text>

  <!-- Rejected → right branch -->
  <line x1="540" y1="580" x2="680" y2="580" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="682,580 670,574 670,586" fill="#94A3B8"/>
  <rect x="682" y="552" width="160" height="56" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="762" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">Not Eligible</text>
  <text x="762" y="594" text-anchor="middle" font-size="11" fill="#B91C1C">Credit/income threshold</text>
  <text x="610" y="570" text-anchor="middle" font-size="11" fill="#D97706">Fail</text>

  <!-- Rejected → down to email send (rejection path) -->
  <line x1="762" y1="608" x2="762" y2="780" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="762,782 756,770 768,770" fill="#FCA5A5"/>

  <!-- Pass → arrow down -->
  <line x1="450" y1="628" x2="450" y2="662" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,664 444,652 456,652" fill="#94A3B8"/>
  <text x="462" y="650" font-size="11" fill="#D97706">Pass</text>

  <!-- ══════════════ STEP 6: Generate PDF Intake Packet ══════════════ -->
  <rect x="300" y="664" width="300" height="64" rx="10" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="450" y="691" text-anchor="middle" font-size="13" font-weight="bold" fill="white">4. Generate PDF Intake Packet</text>
  <text x="450" y="711" text-anchor="middle" font-size="12" fill="#DDD6FE">Populate template with prospect data</text>

  <!-- Arrow down -->
  <line x1="450" y1="728" x2="450" y2="762" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,764 444,752 456,752" fill="#94A3B8"/>

  <!-- ══════════════ STEP 7: Send Approval/Rejection Email ══════════════ -->
  <rect x="280" y="764" width="340" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="450" y="791" text-anchor="middle" font-size="13" font-weight="bold" fill="white">5. Send Status Email to Prospect</text>
  <text x="450" y="811" text-anchor="middle" font-size="12" fill="#BFDBFE">Approved (+ PDF attached) or Rejected (+ reason)</text>

  <!-- Arrow down -->
  <line x1="450" y1="828" x2="450" y2="862" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,864 444,852 456,852" fill="#94A3B8"/>

  <!-- ══════════════ STEP 8: Update CRM ══════════════ -->
  <rect x="300" y="864" width="300" height="72" rx="10" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="450" y="891" text-anchor="middle" font-size="13" font-weight="bold" fill="white">6. Update Excel CRM</text>
  <text x="450" y="910" text-anchor="middle" font-size="12" fill="#A7F3D0">Status: Approved / Rejected</text>
  <text x="450" y="927" text-anchor="middle" font-size="12" fill="#A7F3D0">PDF link + email timestamp</text>

  <!-- Arrow down -->
  <line x1="450" y1="936" x2="450" y2="968" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,970 444,958 456,958" fill="#94A3B8"/>

  <!-- ══════════════ STEP 9: Done ══════════════ -->
  <rect x="340" y="970" width="220" height="56" rx="28" fill="#1A1A2E" stroke="#374151" stroke-width="1.5"/>
  <text x="450" y="1003" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Workflow Complete</text>

  <!-- ══════════════ LEGEND ══════════════ -->
  <rect x="30" y="960" width="230" height="120" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="145" y="984" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Legend</text>
  <rect x="46" y="995" width="18" height="14" rx="3" fill="#2563EB"/>
  <text x="72" y="1007" font-size="11" fill="#374151">Email / Trigger Step</text>
  <rect x="46" y="1017" width="18" height="14" rx="3" fill="#059669"/>
  <text x="72" y="1029" font-size="11" fill="#374151">Excel CRM Update</text>
  <rect x="46" y="1039" width="18" height="14" rx="3" fill="#7C3AED"/>
  <text x="72" y="1051" font-size="11" fill="#374151">Document Generation</text>
  <polygon points="55,1067 72,1058 72,1076" fill="#F59E0B"/>
  <text x="82" y="1071" font-size="11" fill="#374151">Decision Point</text>

</svg>
