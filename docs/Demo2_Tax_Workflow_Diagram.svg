<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1320" width="980" height="1320" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="980" height="1320" fill="#F8F9FB" rx="12"/>

  <!-- Title -->
  <text x="490" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1A2E">W-2 Tax Filing — Automated Workflow</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#6B7280">Vectis Consulting LLC • Demo Flow — Accounting Business</text>

  <!-- ══════ STEP 1: Website Upload Form ══════ -->
  <rect x="315" y="95" width="300" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="465" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="white">1. Client Visits Website</text>
  <text x="465" y="142" text-anchor="middle" font-size="12" fill="#BFDBFE">Uploads W-2 PDF via intake form</text>

  <!-- Arrow -->
  <line x1="465" y1="159" x2="465" y2="193" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,195 459,183 471,183" fill="#94A3B8"/>

  <!-- ══════ STEP 2: AI Parses W-2 ══════ -->
  <rect x="315" y="195" width="300" height="64" rx="10" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="465" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="white">2. AI Parses W-2 Document</text>
  <text x="465" y="242" text-anchor="middle" font-size="12" fill="#DDD6FE">Claude extracts wages, withholdings, employer info</text>

  <!-- Arrow -->
  <line x1="465" y1="259" x2="465" y2="293" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,295 459,283 471,283" fill="#94A3B8"/>

  <!-- ══════ STEP 3: Auto-populate 1040 ══════ -->
  <rect x="315" y="295" width="300" height="64" rx="10" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="465" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="white">3. Auto-Populate Form 1040</text>
  <text x="465" y="342" text-anchor="middle" font-size="12" fill="#DDD6FE">Income, withholding, filing status pre-filled</text>

  <!-- Arrow -->
  <line x1="465" y1="359" x2="465" y2="393" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,395 459,383 471,383" fill="#94A3B8"/>

  <!-- ══════ STEP 4: Deductions Checklist ══════ -->
  <rect x="315" y="395" width="300" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="465" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="white">4. Deductions Checklist</text>
  <text x="465" y="442" text-anchor="middle" font-size="12" fill="#BFDBFE">Mortgage interest, donations, student loans, etc.</text>

  <!-- Decision: Itemize? -->
  <line x1="465" y1="459" x2="465" y2="493" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,495 459,483 471,483" fill="#94A3B8"/>

  <polygon points="465,495 565,540 465,585 365,540" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <text x="465" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Itemize</text>
  <text x="465" y="552" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Deductions?</text>

  <!-- Yes → Schedule A -->
  <line x1="565" y1="540" x2="710" y2="540" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="712,540 700,534 700,546" fill="#94A3B8"/>
  <rect x="712" y="512" width="190" height="56" rx="8" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="807" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Schedule A Generated</text>
  <text x="807" y="554" text-anchor="middle" font-size="11" fill="#DDD6FE">Itemized deductions form</text>
  <text x="635" y="530" text-anchor="middle" font-size="11" fill="#D97706">Yes</text>

  <!-- No → continue down -->
  <line x1="465" y1="585" x2="465" y2="619" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,621 459,609 471,609" fill="#94A3B8"/>
  <text x="477" y="608" font-size="11" fill="#D97706">No</text>

  <!-- Schedule A joins back -->
  <line x1="807" y1="568" x2="807" y2="635" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="807" y1="635" x2="465" y2="635" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ══════ STEP 5: Investment Accounts ══════ -->
  <rect x="315" y="621" width="300" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="465" y="648" text-anchor="middle" font-size="13" font-weight="bold" fill="white">5. Investment Account Upload</text>
  <text x="465" y="668" text-anchor="middle" font-size="12" fill="#BFDBFE">User uploads brokerage statement (e.g. Robinhood)</text>

  <!-- Arrow -->
  <line x1="465" y1="685" x2="465" y2="719" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,721 459,709 471,709" fill="#94A3B8"/>

  <!-- ══════ STEP 6: AI Reads Brokerage Statement ══════ -->
  <rect x="315" y="721" width="300" height="64" rx="10" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="465" y="748" text-anchor="middle" font-size="13" font-weight="bold" fill="white">6. AI Reads Brokerage Statement</text>
  <text x="465" y="768" text-anchor="middle" font-size="12" fill="#DDD6FE">Extracts dividends, capital gains, stock sales</text>

  <!-- Arrow to decision -->
  <line x1="465" y1="785" x2="465" y2="819" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,821 459,809 471,809" fill="#94A3B8"/>

  <!-- Decision diamond: Schedule B? -->
  <polygon points="465,821 565,866 465,911 365,866" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <text x="465" y="861" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Dividends</text>
  <text x="465" y="878" text-anchor="middle" font-size="12" font-weight="bold" fill="white">&gt;$1,500?</text>

  <!-- Yes → Schedule B -->
  <line x1="565" y1="866" x2="710" y2="866" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="712,866 700,860 700,872" fill="#94A3B8"/>
  <rect x="712" y="838" width="190" height="56" rx="8" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="807" y="862" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Schedule B Generated</text>
  <text x="807" y="880" text-anchor="middle" font-size="11" fill="#DDD6FE">Interest &amp; dividend income</text>
  <text x="635" y="856" text-anchor="middle" font-size="11" fill="#D97706">Yes</text>

  <!-- No label -->
  <text x="477" y="908" font-size="11" fill="#D97706">No</text>

  <!-- Arrow down to Schedule D decision -->
  <line x1="465" y1="911" x2="465" y2="945" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,947 459,935 471,935" fill="#94A3B8"/>

  <!-- Schedule B joins back -->
  <line x1="807" y1="894" x2="807" y2="960" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="807" y1="960" x2="465" y2="960" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Decision: Stocks sold? -->
  <polygon points="465,947 565,992 465,1037 365,992" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <text x="465" y="987" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Stocks /</text>
  <text x="465" y="1004" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Equities Sold?</text>

  <!-- Yes → Schedule D -->
  <line x1="565" y1="992" x2="710" y2="992" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="712,992 700,986 700,998" fill="#94A3B8"/>
  <rect x="712" y="964" width="190" height="56" rx="8" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="807" y="988" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Schedule D Generated</text>
  <text x="807" y="1006" text-anchor="middle" font-size="11" fill="#DDD6FE">Capital gains &amp; losses</text>
  <text x="635" y="982" text-anchor="middle" font-size="11" fill="#D97706">Yes</text>

  <!-- No label -->
  <text x="477" y="1034" font-size="11" fill="#D97706">No</text>

  <!-- Schedule D joins back -->
  <line x1="807" y1="1020" x2="807" y2="1070" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="807" y1="1070" x2="465" y2="1070" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Arrow down -->
  <line x1="465" y1="1037" x2="465" y2="1071" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,1073 459,1061 471,1061" fill="#94A3B8"/>

  <!-- ══════ STEP 7: State Residency ══════ -->
  <rect x="315" y="1073" width="300" height="64" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="465" y="1100" text-anchor="middle" font-size="13" font-weight="bold" fill="white">7. State Selection</text>
  <text x="465" y="1120" text-anchor="middle" font-size="12" fill="#BFDBFE">User selects state → state return pre-populated</text>

  <!-- Arrow -->
  <line x1="465" y1="1137" x2="465" y2="1171" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,1173 459,1161 471,1161" fill="#94A3B8"/>

  <!-- ══════ STEP 8: Review & Confirm ══════ -->
  <rect x="315" y="1173" width="300" height="64" rx="10" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="465" y="1200" text-anchor="middle" font-size="13" font-weight="bold" fill="white">8. Staff Review &amp; Approval</text>
  <text x="465" y="1220" text-anchor="middle" font-size="12" fill="#A7F3D0">Preparer confirms all fields before export</text>

  <!-- Arrow -->
  <line x1="465" y1="1237" x2="465" y2="1261" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="465,1263 459,1251 471,1251" fill="#94A3B8"/>

  <!-- ══════ FINAL: Export ══════ -->
  <rect x="355" y="1263" width="220" height="32" rx="16" fill="#1A1A2E" stroke="#374151" stroke-width="1.5"/>
  <text x="465" y="1284" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Export Ready for ProSeries</text>

  <!-- ══════ LEGEND ══════ -->
  <rect x="28" y="1165" width="230" height="130" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="143" y="1188" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Legend</text>
  <rect x="44" y="1199" width="18" height="14" rx="3" fill="#2563EB"/>
  <text x="70" y="1211" font-size="11" fill="#374151">User Input / Upload Step</text>
  <rect x="44" y="1221" width="18" height="14" rx="3" fill="#7C3AED"/>
  <text x="70" y="1233" font-size="11" fill="#374151">AI Processing / Form Generation</text>
  <rect x="44" y="1243" width="18" height="14" rx="3" fill="#059669"/>
  <text x="70" y="1255" font-size="11" fill="#374151">Human Review Step</text>
  <polygon points="53,1278 70,1269 70,1287" fill="#F59E0B"/>
  <text x="80" y="1282" font-size="11" fill="#374151">Decision / Branch Point</text>

</svg>
